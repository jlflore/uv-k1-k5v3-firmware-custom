name: K1 Remote — compilation et captures

on:
  push:
    branches: [k1remote-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilation de l'APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Captures d'écran (Robolectric, sans radio)
        run: ./gradlew --no-daemon testDebugUnitTest --tests fr.jlambert.k1remote.ScreensTest
      - name: Contrôle des fonctions (sans radio)
        if: always()
        run: |
          ./gradlew --no-daemon testDebugUnitTest --tests fr.jlambert.k1remote.FunctionsTest --tests fr.jlambert.k1remote.RadioStatusTest --tests fr.jlambert.k1remote.RadioStateTest --tests fr.jlambert.k1remote.ShortcutStatesTest
      - name: APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: K1Remote-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - name: Captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: app/build/screenshots
          if-no-files-found: warn
      - name: Rapport des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: app/build/reports/tests
          if-no-files-found: ignore
      - name: Publier les captures sur la branche k1remote-captures
        if: always()
        run: |
          set -e
          [ -d app/build/screenshots ] || exit 0
          rm -rf /tmp/pub && mkdir /tmp/pub && cp -r app/build/screenshots/. /tmp/pub/
          mkdir -p /tmp/pub/tests && cp app/build/test-results/testDebugUnitTest/*.xml /tmp/pub/tests/ 2>/dev/null || true
          cd /tmp/pub
          git init -q -b k1remote-captures
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Captures de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" k1remote-captures
