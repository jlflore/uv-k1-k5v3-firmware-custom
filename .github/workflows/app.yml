name: K1 Remote — compilation et captures

on:
  push:
    branches: [k1remote-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilation de l'APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Captures d'écran (Robolectric, sans radio)
        run: ./gradlew --no-daemon testDebugUnitTest --tests fr.jlambert.k1remote.ScreensTest
      - name: APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: K1Remote-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - name: Captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: app/build/screenshots
          if-no-files-found: warn
      - name: Rapport des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: app/build/reports/tests
          if-no-files-found: ignore
