name: Build Firmware

on:
  push:
    branches: [ main, temoin, k1remote ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Compile firmware
      run: |
        chmod +x compile-firmware.sh compile-app.sh
        ./compile-firmware.sh Fusion -DEDITION_STRING=FusionPTTr12

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-artifact
        path: |
          build/*/*.bin
          build/Apps/*.app
