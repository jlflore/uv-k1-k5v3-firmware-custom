name: Build Firmware

on:
  push:
    branches: [ main, temoin, k1remote, 'k1-*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Contrôle du contrat 0x0A (lecture des réglages)
      run: |
        python3 tools/k1r_check_0x0A.py
        gcc -Wall -Wextra -Werror -o /tmp/test_k1r_upcode tools/test_k1r_upcode.c && /tmp/test_k1r_upcode

    - name: Compile firmware
      run: |
        chmod +x compile-firmware.sh compile-app.sh
        ./compile-firmware.sh Fusion "-DEDITION_STRING=FusPTT r32"

    - name: Contrôle des positions de menu (firmware compilé et appli)
      run: |
        git fetch --depth=1 origin k1remote-app
        git show origin/k1remote-app:app/src/main/java/fr/jlambert/k1remote/RadioSettings.kt > /tmp/RadioSettings.kt
        python3 tools/k1r_check_positions.py build/Fusion/compile_commands.json /tmp/RadioSettings.kt

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-artifact
        path: |
          build/*/*.bin
          build/Apps/*.app

    - name: Publish binaries to a git branch
      run: |
        mkdir -p /tmp/out && cp build/Fusion/*.bin build/Fusion/*.elf build/Fusion/*.map /tmp/out/ && ls -la /tmp/out
        git config user.name "ci" && git config user.email "ci@localhost"
        git checkout --orphan "bin-${GITHUB_REF_NAME}"
        git rm -rq --cached . && git clean -fdxq
        cp /tmp/out/* . && git add -f *.bin *.elf *.map
        git commit -qm "binaires ${GITHUB_SHA}"
        git push -f origin "bin-${GITHUB_REF_NAME}"
